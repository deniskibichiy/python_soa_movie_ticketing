<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOA Movie Ticketing</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="container">
            <h1>Movie Ticketing</h1>
            <p>Browse movies and purchase tickets.</p>
        </div>
    </header>

    <main class="container">
        <section class="panel">
            <h2>Find Movies</h2>

            <form id="movie-search-form">
                <label for="year">Release year</label>

                <div class="form-row">
                    <input
                        type="number"
                        id="year"
                        name="year"
                        min="1888"
                        max="2100"
                        placeholder="e.g. 2026"
                        required
                    >

                    <button type="submit">Search</button>
                </div>
            </form>

            <div id="movie-results" class="movie-grid">
                <p>Search for movies to see available titles.</p>
            </div>
        </section>

        <section class="panel">
            <h2>Purchase Tickets</h2>

            <form id="purchase-form">
                <label for="movie-id">Movie ID</label>
                <input
                    type="number"
                    id="movie-id"
                    min="1"
                    required
                    placeholder="Select a movie above"
                >

                <label for="ticket-count">Number of tickets</label>
                <input
                    type="number"
                    id="ticket-count"
                    min="1"
                    value="1"
                    required
                >

                <label for="card-number">Demo card number</label>
                <input
                    type="text"
                    id="card-number"
                    required
                    placeholder="Enter a test number"
                >

                <p class="hint">
                    Demonstration only. Do not enter real payment card details.
                </p>

                <button type="submit">Purchase Tickets</button>
            </form>

            <div id="purchase-result" class="message" aria-live="polite"></div>
        </section>

        <section class="panel">
            <div class="section-heading">
                <h2>Ticket Records</h2>
                <button id="load-tickets-button" type="button">
                    Load Tickets
                </button>
            </div>

            <div id="ticket-results">
                <p>Click Load Tickets to retrieve ticket counts.</p>
            </div>
        </section>

        <div id="app-message" class="message" aria-live="polite"></div>
    </main>

    <footer>
        <p>SOA Movie Ticketing System</p>
    </footer>
</body>
</html>
